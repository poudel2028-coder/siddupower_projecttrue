<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Track your sports stats with friends">
    <title>{% block title %}Sports Stats{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">Stats</a>
            <button class="burger-menu" id="burgerMenu" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-links" id="navLinks">
                {% if user %}
                <a href="/" class="nav-link">Dashboard</a>
                <a href="/friends" class="nav-link">Friends</a>
                <a href="/teams" class="nav-link">Teams</a>
                <a href="/challenge" class="nav-link">Challenge</a>
                <a href="/1v1" class="nav-link">1v1</a>
                <a href="/hall-of-fame" class="nav-link">Hall of Fame</a>
                <a href="/refereeing" class="nav-link">Refereeing</a>
                <a href="/logout" class="nav-link nav-logout">Logout</a>
                {% else %}
                <a href="/login" class="nav-link">Login</a>
                <a href="/register" class="nav-link">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Built for friends who love sports</p>
    </footer>

    <script>
        const burgerMenu = document.getElementById('burgerMenu');
        const navLinks = document.getElementById('navLinks');

        burgerMenu.addEventListener('click', function() {
            navLinks.classList.toggle('active');
            burgerMenu.classList.toggle('active');
        });

        // Close menu when clicking a link
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('active');
                burgerMenu.classList.remove('active');
            });
        });

        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            if (!navLinks.contains(event.target) && !burgerMenu.contains(event.target)) {
                navLinks.classList.remove('active');
                burgerMenu.classList.remove('active');
            }
        });

        // Prevent swipe gestures from opening menu
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;

            // Only allow burger button to open menu, not swipe
            if (Math.abs(diff) > swipeThreshold) {
                // Prevent default swipe behavior
                return;
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
