{% extends "base.html" %}

{% block title %}Register - Sports Stats{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <h2>Create account</h2>
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
        <form method="post" action="/register">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-full">Create Account</button>
        </form>
        <p style="margin-top: 1.5rem; text-align: center; color: var(--text-secondary);">
            Already have an account? <a href="/login" style="color: var(--accent);">Sign In</a>
        </p>
    </div>
</div>
{% endblock %}
