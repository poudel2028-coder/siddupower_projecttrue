{% extends "base.html" %}

{% block title %}Register - Sports Stats{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <h2>Create Account</h2>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">Join the community and start tracking your sports stats</p>
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
        <form method="post" action="/register">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus placeholder="Choose a username (min 3 characters)">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Choose a password (min 6 characters)">
            </div>
            <button type="submit" class="btn btn-full">Create Account</button>
        </form>
        <p style="margin-top: 2rem; text-align: center; color: var(--text-secondary);">
            Already have an account? <a href="/login" style="color: var(--accent); font-weight: 600;">Sign In</a>
        </p>
    </div>
</div>
{% endblock %}
